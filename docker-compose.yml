# CSIBER AQAR — single-instance deployment.
#
# IMPORTANT: do not add `deploy.replicas` or otherwise scale this service.
# The database is SQLite in WAL mode on a mounted volume; a second writer
# process would corrupt it. Vertical scaling only.

services:
  app:
    build: .
    image: csiber-aqar:latest
    restart: unless-stopped

    # Bound to localhost: nginx on the host terminates TLS and proxies in.
    # Exposing 3000 publicly would bypass HTTPS and the request-size limit.
    ports:
      - '127.0.0.1:3000:3000'

    env_file:
      - .env

    volumes:
      # Everything that must survive a redeploy: the database, uploaded
      # evidence, and generated documents.
      - ./data:/data

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
