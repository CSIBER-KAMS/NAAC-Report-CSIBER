# CSIBER AQAR — nginx reverse proxy with TLS.
#
# Install to /etc/nginx/sites-available/aqar.conf and symlink into
# sites-enabled. Obtain the certificate with:
#   sudo certbot --nginx -d aqar.siberindia.edu.in
#
# Replace the server_name with the real hostname before use.

server {
    listen 80;
    listen [::]:80;
    server_name aqar.siberindia.edu.in;

    # Certbot writes its challenge files here.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aqar.siberindia.edu.in;

    ssl_certificate     /etc/letsencrypt/live/aqar.siberindia.edu.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aqar.siberindia.edu.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS lives here, not in the application, so it stays tied to the
    # certificate. Only enable once HTTPS is confirmed working — it is not
    # easily reversible in browsers that have seen it.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Evidence uploads are capped at 50 MB in the application, but that check
    # runs only after the body has been buffered. Rejecting oversize bodies
    # here is what actually protects the app's memory.
    client_max_body_size 55m;

    # Generating the AQAR walks 117 metrics and builds a Word document; the
    # default 60s proxy timeout is not always enough on modest hardware.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    access_log /var/log/nginx/aqar.access.log;
    error_log  /var/log/nginx/aqar.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Required for the application's per-IP login throttling; pair it with
        # TRUSTED_PROXY=1 in the app environment.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
